<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#020503">
  <meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Arcana AI: play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="frame">
      <div id="game"></div>
      <div id="fx"></div>
      <div id="flash"></div>
      <div id="hud" class="hidden"></div>
      <div id="bossbar" class="hidden"></div>
      <div id="hint" class="hidden"></div>
      <div id="title" class="hidden"></div>
      <div id="overlay" class="hidden"></div>
      <div id="card"></div>
      <div id="cine"><div class="bar top"></div><div class="bar bot"></div></div>
      <div id="touch" class="hidden">
        <div><button data-k="left">◀</button><button data-k="right">▶</button></div>
        <div><button data-k="act">E</button><button data-k="jump">▲</button></div>
      </div>
      <div id="rotate"><div><svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M4 8a9 9 0 0 1 3-4M20 16a9 9 0 0 1-3 4"/></svg><b>Rotate your phone</b><span>Arcana plays best sideways</span></div></div>
      <div id="wipe"><div class="cover"></div><i class="edge"></i></div>
    </div>
  </div>
  <script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="audio.js"></script>
  <script src="art-env.js"></script>
  <script src="art-chars.js"></script>
  <script src="art-people.js"></script>
  <script src="fight.js"></script>
  <script src="combat.js"></script>
  <script src="arcade.js"></script>
  <script src="ui.js"></script>
  <script src="game.js"></script>
</body>
</html>
