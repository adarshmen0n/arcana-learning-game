# Render Blueprint: one web service running the Arcana server (student dashboard + game + API). Free plan disk is ephemeral.
services:
  - type: web
    name: arcana-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server/server.py
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ARCANA_HOSTED
        value: "1"
      - key: ARCANA_MAX_GAMES_PER_DAY
        value: "0"
      # Secrets: paste these in the Render dashboard (they are not stored in the repo).
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
